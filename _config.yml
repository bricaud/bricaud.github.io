# Site settings — used by the layouts and by jekyll-seo-tag to build the
# Open Graph / Twitter card tags that make links look good on social media.
# This file is NOT reloaded by 'jekyll serve': restart the server after editing.

theme: jekyll-theme-minimal
title: Benjamin Ricaud
tagline: Machine Learning, Generative AI, Graphs
logo: /assets/img/Benjaminroundbwsmall.png
description: Associate Professor @ UiT, Norway. Machine Learning, Generative AI, Graphs, data science. benjamin.ricaud[at]uit.no
email: benjamin.ricaud@uit.no
url: "https://bricaud.github.io"
baseurl: ""
lang: en
twitter_username: GBR_data
github_username: bricaud

# Default image shown when a page/post is shared and has no `image:` of its own.
image: /assets/img/bricaud.jpg

# jekyll-seo-tag
author:
  name: Benjamin Ricaud
  twitter: GBR_data
twitter:
  username: GBR_data
  card: summary_large_image
social:
  name: Benjamin Ricaud
  links:
    - https://twitter.com/GBR_data
    - https://github.com/bricaud
    - https://www.linkedin.com/in/benjaminricaud
    - https://scholar.google.fr/citations?user=muGuSyoAAAAJ

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: blog/feed.xml

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
  - scope:
      path: "blog/archive"
      type: posts
    values:
      layout: post
      archived: true
      permalink: /blog/archive/:title/
      sitemap: false

exclude:
  - CLAUDE.md
  - BLOG_INSTRUCTIONS.md
  - Gemfile
  - Gemfile.lock
  - vendor/
